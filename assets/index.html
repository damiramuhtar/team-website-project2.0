<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заказ беру</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    label { display:block; margin-top:15px; font-size:18px; }
    input, select { padding:10px; width:100%; max-width:400px; margin-top:5px; }
    .hidden { display:none; }
    button { margin-top:20px; padding:12px 25px; background:#ff6fb7; border:none; color:white; font-size:18px; border-radius:10px; }
  </style>
</head>
<body>
  <h1>Заказ беру</h1>
  <form>
    <label>Аты-жөніңіз:
      <input type="text" required />
    </label>

    <label>Телефон нөміріңіз:
      <input type="text" required />
    </label>

    <label>Қалай аласыз?
      <select id="delivery-select">
        <option value="self">Самовывоз</option>
        <option value="del">Доставка</option>
      </select>
    </label>

    <label id="address-label" class="hidden">Мекенжайыңыз:
      <input type="text" />
    </label>

    <p id="delivery-info" class="hidden" style="margin-top:15px; font-size:18px;">Ойыншығыңыз 5–10 күн ішінде келеді.</p>

    <button type="submit">Жіберу</button>
  </form>

  <script>
    const select = document.getElementById('delivery-select');
    const addr = document.getElementById('address-label');
    const info = document.getElementById('delivery-info');

    select.addEventListener('change', () => {
      if (select.value === 'del') {
        addr.classList.remove('hidden');
        info.classList.remove('hidden');
      } else {
        addr.classList.add('hidden');
        info.classList.add('hidden');
      }
    });
  </script>
</body>
</html></body>
</html>
